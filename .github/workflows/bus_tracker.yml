name: バス到着時刻記録

on:
  schedule:
    # JST 06:00 = UTC 21:00（前日）
    - cron: '0 21 * * 0-4'

  workflow_dispatch:
    inputs:
      route_id:
        description: '追跡する路線'
        required: true
        type: choice
        options:
          - 89_up
          - 98_up
        default: 89_up

      ignore_time_check:
        description: '時間帯チェックを無視して即座に実行する（テスト用）'
        type: boolean
        default: false

concurrency:
  group: bus-tracker
  cancel-in-progress: false

jobs:

  track-89:
    if: github.event_name == 'schedule' || inputs.route_id == '89_up'
    runs-on: ubuntu-latest
    timeout-minutes: 190

    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install requests pandas beautifulsoup4

      - name: 89番を追跡
        run: |
          python -u scripts/tracker/bus_tracker.py --route 89_up
        env:
          TZ: Asia/Tokyo
          IGNORE_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_time_check && '1' || '0' }}
          DEBUG_STATETABLE: "0"

      - name: 89番のデータをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add \
            data/routes/89_up/bus_arrival_log.csv \
            data/routes/89_up/bus_live_position.json \
            || true

          git diff --staged --quiet || \
            git commit -m "🚌 89_up バス到着記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"

          git push || true


  track-98:
    if: github.event_name == 'schedule' || inputs.route_id == '98_up'
    runs-on: ubuntu-latest
    timeout-minutes: 190

    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: pip install requests pandas beautifulsoup4

      - name: 98番を追跡
        run: |
          python -u scripts/tracker/bus_tracker.py --route 98_up
        env:
          TZ: Asia/Tokyo
          IGNORE_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_time_check && '1' || '0' }}
          DEBUG_STATETABLE: "0"

      - name: 98番のデータをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin main || true

          git add \
            data/routes/98_up/bus_arrival_log.csv \
            data/routes/98_up/bus_live_position.json \
            || true

          git diff --staged --quiet || \
            git commit -m "🚌 98_up バス到着記録 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"

          git push || true
